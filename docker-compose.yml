version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vmax-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: vmax
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - vmax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vmax_pgdata:
