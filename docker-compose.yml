version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vmax-postgres
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_DB: vmax
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - vmax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vmax-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - vmax_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vmax_pgdata:
  vmax_redisdata:
